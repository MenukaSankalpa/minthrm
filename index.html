 window.location = http_path + "Site/Index";                     $("#User_user_name").prop('disabled', true);

                    });

    function onSignIn(googleUser) {

        var lastLogOutTime = parseInt(sessionStorage.getItem("signout"));
        var nextAllowedMinLogInTime = lastLogOutTime + 3000;
        var current = $.now();

        if(current > nextAllowedMinLogInTime || isNaN(lastLogOutTime)){
            showInfoMessage();
            var profile = googleUser.getBasicProfile();
            var id_token = googleUser.getAuthResponse().id_token;
            //sendUserDataToAuthenticate(id_token,googleUser);
            if (googleUser.hasGrantedScopes('openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events')){
                sendUserDataToAuthenticateUser(id_token,googleUser);
            }else{
                googleUser.grantOfflineAccess({
                    scope: 'openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events',
                    hint :profile.getEmail()
                }).then(function (res) {
                    sendUserDataToAuthenticate(res.code);
                })
            }
           // verifyUser(id_token,googleUser);
        }
    }

    function onFailure(error) {
        console.log(error);
    }
    function renderButton() {
        gapi.signin2.render('my-signin2', {
            'scope': 'openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
            'width': 300,
            'height': 35,
            'longtitle': true,
            'theme': 'light',
            'onsuccess': onSignIn,
            'onfailure': onFailure
        });
    }


    function sendUserDataToAuthenticateUser(idToken,googleUser) {
        path = 'site/authenticateGoogleAccount';
        var extraData = "&idToken=" + idToken+"&access_token="+googleUser.getAuthResponse().access_token;
        //var extraData = "&code=" + code+"&idToken="+idtoken;
        $.ajax({
            type: "POST",
            url: http_path + path,
            data: extraData,
            success: function (res) {
                //callback(res);
                var obj = jQuery.parseJSON(res);
                if (obj.code == 200){
                    showSuccessMessage(obj.msg);
                                        window.location = http_path + "Site/Index";
                    
                    $("#User_user_name").prop('disabled', true);
                    $("#User_user_password").prop('disabled', true);

                }else if (obj.code == 201) {
                    window.location = http_path + "Site/passWordChange";
                }
                else {console.log("login error");
                    showErrorMessage(obj.msg);
                    signOut();
                }
            }
        });
    }


    function sendUserDataToAuthenticate(code) {
        path = 'site/authenticateGoogleAccount';
        //var extraData = "&idToken=" + id_token+"&access_token="+googleUser.getAuthResponse().access_token;
        var extraData = "&code="+code;
        $.ajax({
            type: "POST",
            url: http_path + path,
            data: extraData,
            success: function (res) {
                //callback(res);
                var obj = jQuery.parseJSON(res);
                if (obj.code == 200){
                showSuccessMessage(obj.msg);
                 
                            window.location = http_path + "Site/Index"; 
                                    
                    $("#User_user_name").prop('disabled', true);
                    $("#User_user_password").prop('disabled', true);
                    
                }else if (obj.code == 201) {
                    window.location = http_path + "Site/passWordChange";
                    }
                else {console.log("login error");
                    showErrorMessage(obj.msg);
                    signOut();
                }
            }
        });
}

    function signOut() {
        var auth2 = gapi.auth2.getAuthInstance();
        auth2.signOut().then(function () {
            sessionStorage.setItem("signout", $.now());
        });
    }
    
    var passwordInputLogin = document.querySelector("#User_user_password");
    var eyeLogin = document.querySelector("#eye");

    eyeLogin.addEventListener("click", function(){
        this.classList.toggle("fa-eye-slash");
        var type = passwordInputLogin.getAttribute("type") === "password" ? "text" : "password";
        passwordInputLogin.setAttribute("type", type);
    });

</script>
